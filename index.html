<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fast Bridge by Avail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
    }

    /* ── Page Wrapper (fills viewport) ────────────── */
    .page {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      display: none;
    }
    .page.active { display: block; }

    /* ── MegaETH Dark Background ─────────────────── */
    .page--megaeth {
      background: #19191A;
    }

    /* ── MegaETH Design System Overrides ────────── */
    /* MegaETH uses 0 border-radius (sharp/square corners on everything),
       dark surfaces, and its own button/input styles */

    /* Nav — light bar with dark bottom border */
    .page--megaeth .nav {
      background: #e5e5e3;
      border-bottom: 1px solid #19191a;
    }
    .page--megaeth .nav__chain-logo {
      /* dark logo on light nav — no invert needed */
    }
    .page--megaeth .nav__bridge-text {
      color: #0a0a0a;
      font-size: 13.2px;
    }
    .page--megaeth .nav__avail-logo {
      /* dark logo on light nav — no invert needed */
    }
    .page--megaeth .nav__connect-btn {
      background: transparent;
      border: none;
      color: #19191a;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 16px;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      width: auto;
      height: auto;
      white-space: nowrap;
    }
    .page--megaeth .nav__connect-btn .connect-arrow {
      width: 16px;
      height: 16px;
      background: #19191a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .page--megaeth .nav__connect-btn .connect-arrow img {
      width: 10px;
      height: 10px;
    }

    /* Bridge Card — square, dark, with border + glow */
    .page--megaeth .bridge-card {
      background: #161718;
      border: 1px solid #dfd9d8;
      border-radius: 0;
      box-shadow: 0px 0px 24px 8px rgba(255,255,255,0.06);
      padding: 16px;
    }
    .page--megaeth .bridge-card__label {
      color: #f9fafb;
      font-size: 15.8px;
      font-weight: 600;
    }

    /* Comboboxes — square, dark inner surface, no shadow */
    .page--megaeth .combobox {
      background: #1f2023;
      border: none;
      border-radius: 0;
      box-shadow: none;
      height: 44px;
    }
    .page--megaeth .combobox__name,
    .page--megaeth .combobox__name--token {
      color: #f9fafb;
    }
    .page--megaeth .combobox__chevron {
      filter: invert(1);
    }

    /* Amount Input — square, dark, borderless */
    .page--megaeth .amount-input {
      border: none;
      border-radius: 0;
      background: #1f2023;
      height: 44px;
    }
    .page--megaeth .amount-input__field {
      color: #f9fafb;
      border-radius: 0;
    }
    .page--megaeth .amount-input__field::placeholder {
      color: rgba(249,250,251,0.4);
    }

    /* Recipient Address */
    .page--megaeth .recipient-row__text {
      color: #bebfc0;
    }
    .page--megaeth .recipient-row__edit {
      filter: invert(1);
    }

    /* Connect Wallet Button — yellow, square, bold */
    .page--megaeth .connect-btn-card {
      background: #FCDB32;
      color: #000;
      font-weight: 600;
      font-size: 15px;
      border-radius: 0;
      box-shadow: none;
      height: 44px;
    }

    /* Help Link — square, dark border */
    .page--megaeth .help-link {
      border-color: #3a3a3a;
      border-radius: 0;
    }
    .page--megaeth .help-link__text {
      color: #bebfc0;
    }

    /* ── Fluffey Radar (MegaETH) ─────────────────── */
    .mega-fluffey-radar {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 330px;
      height: 330px;
      overflow: hidden;
      pointer-events: none;
    }
    .mega-fluffey-radar__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mega-fluffey-radar__scan {
      position: absolute;
      inset: -10px;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      object-fit: cover;
      animation: radarSpin 4s linear infinite;
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── Monad Background ──────────────────────────── */
    .page--monad {
      background: #fefefe;
    }
    .monad-bg-waves {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .monad-bg-waves img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Ensure Monad content sits above the background */
    .page--monad .nav,
    .page--monad .bridge-card,
    .page--monad .chain-selection,
    .page--monad .help-link {
      z-index: 1;
    }

    /* ── Monad Design System Overrides ─────────────── */
    /* Monad uses large border-radius (24px), glassmorphism cards,
       purple accent (#6E54FF), Roboto Mono CTA, #f9f9f9 surfaces */

    /* Nav — taller, no border, transparent */
    .page--monad .nav {
      height: 80px;
      border-bottom: none;
      background: transparent;
    }

    /* Bridge Card — glassmorphism, large radius */
    .page--monad .bridge-card {
      background: rgba(251, 250, 249, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #e4e4e7;
      border-radius: 24px;
      box-shadow: 0px 8px 32px -16px rgba(0, 0, 0, 0.16);
      padding: 24px;
    }
    .page--monad .bridge-card__label {
      font-size: 12px;
      font-weight: 500;
      color: #9f9fa9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Comboboxes — rounded pill, light surface */
    .page--monad .combobox {
      background: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 48px;
      box-shadow: none;
      height: 48px;
      padding: 0 16px;
    }
    .page--monad .combobox__name,
    .page--monad .combobox__name--token {
      color: #3f3f46;
      font-weight: 500;
      font-size: 16px;
    }

    /* Amount Input — rounded, light surface */
    .page--monad .amount-input {
      background: #f9f9f9;
      border: none;
      border-radius: 8px;
      height: 48px;
    }
    .page--monad .amount-input__field {
      color: #3f3f46;
      font-size: 14px;
    }
    .page--monad .amount-input__field::placeholder {
      color: rgba(0, 0, 0, 0.38);
    }

    /* Recipient Address */
    .page--monad .recipient-row__text {
      color: #3f3f46;
    }

    /* Connect Wallet Button — purple, rounded, Roboto Mono */
    .page--monad .connect-btn-card {
      background: #6E54FF;
      color: #fff;
      font-family: 'Roboto Mono', monospace;
      font-weight: 400;
      font-size: 16px;
      text-transform: uppercase;
      border-radius: 24px;
      height: 48px;
      box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.2), 0px 0px 0px 1px rgba(79, 71, 235, 0.9);
      letter-spacing: 0.5px;
    }

    /* Help Link */
    .page--monad .help-link {
      border-color: #e4e4e7;
      border-radius: 24px;
    }

    /* ── Citrea Design System ─────────────────────── */
    /* Citrea uses light gray bg, floating pill nav with backdrop blur,
       orange accent (#ffb132 borders, #cc5c02 text), rounded 12-16px,
       Inter font, semi-transparent card surfaces */

    .page--citrea {
      background: #f4f6f8;
    }

    /* Nav — floating pill, backdrop blur, shadow */
    .page--citrea .nav {
      top: 40px;
      left: 40px;
      right: 40px;
      height: 82px;
      border-bottom: none;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0px 4px 35px -1px rgba(21, 53, 63, 0.2);
      padding: 0 32px;
    }
    .page--citrea .nav__chain-logo--citrea {
      width: 131px;
      height: 32px;
    }
    .page--citrea .nav__bridge-text {
      color: #020817;
    }
    .page--citrea .nav__connect-btn {
      background: transparent;
      border: 1px solid #ffb132;
      color: #cc5c02;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12.6px;
      border-radius: 12px;
      padding: 0 24px;
      height: 38px;
      white-space: nowrap;
      width: auto;
      min-width: fit-content;
      flex-shrink: 0;
    }

    /* Bridge Card — semi-transparent, rounded */
    .page--citrea .bridge-card {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid #fff;
      border-radius: 16px;
      box-shadow: none;
      padding: 24px 32px;
      top: 170px;
      width: 560px;
    }
    .page--citrea .bridge-card__label {
      color: #020817;
      font-size: 17.8px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    /* Comboboxes — rounded, light surface, gray border */
    .page--citrea .combobox {
      background: #fafafa;
      border: 1px solid #e9e9ec;
      border-radius: 12px;
      box-shadow: none;
      height: 50px;
    }
    .page--citrea .combobox__name,
    .page--citrea .combobox__name--token {
      color: #020817;
      font-weight: 500;
      font-size: 12.7px;
    }

    /* Amount Input — rounded, light surface */
    .page--citrea .amount-input {
      background: #fafafa;
      border: 1px solid #e9e9ec;
      border-radius: 12px;
      height: 48px;
    }
    .page--citrea .amount-input__field {
      color: #020817;
      font-size: 20px;
    }
    .page--citrea .amount-input__field::placeholder {
      color: #71717b;
      font-size: 14px;
    }

    /* Recipient Address */
    .page--citrea .recipient-row__text {
      color: #71717b;
    }

    /* Connect Wallet Button — orange outline, rounded */
    .page--citrea .connect-btn-card {
      background: transparent;
      color: #cc5c02;
      font-weight: 600;
      font-size: 12.6px;
      border: 1px solid #ffb132;
      border-radius: 12px;
      box-shadow: none;
      height: 46px;
    }

    /* Help Link */
    .page--citrea .help-link {
      border-color: #e9e9ec;
      border-radius: 12px;
    }
    .page--citrea .help-link__text {
      color: #71717b;
    }

    /* ── Navbar ──────────────────────────────────── */
    .nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7.8%;
      border-bottom: 1px solid #e5e5e5;
      z-index: 10;
    }

    .nav__left {
      display: flex;
      align-items: center;
      gap: 0;
      height: 33px;
    }

    .nav__chain-logo {
      height: 32px;
      object-fit: contain;
    }
    .nav__chain-logo--megaeth { width: 201px; }
    .nav__chain-logo--monad { width: 170px; }
    .nav__chain-logo--citrea { width: 130px; }

    .nav__bridge-text {
      font-size: 18.6px;
      font-weight: 400;
      color: #0a0a0a;
      line-height: 28px;
      margin-left: 5px;
      white-space: nowrap;
    }

    .nav__avail-logo {
      width: 75px;
      height: 22px;
      object-fit: contain;
      margin-left: 5px;
      margin-top: -1px;
    }

    .nav__connect-btn {
      width: 136px;
      height: 40px;
      background: #fff;
      border: 1px solid #ebebeb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13.2px;
      font-weight: 400;
      color: #171717;
      line-height: 20px;
    }

    /* ── Bridge Form Card ────────────────────────── */
    .bridge-card {
      position: absolute;
      top: 133px;
      left: 50%;
      transform: translateX(-50%);
      width: 576px;
      max-width: 90vw;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      box-shadow: 0px 1px 3px 0px rgba(0,0,0,0.1), 0px 1px 2px -1px rgba(0,0,0,0.1);
      padding: 25px;
      display: flex;
      flex-direction: column;
    }

    .bridge-card__label {
      font-size: 13.3px;
      font-weight: 700;
      color: #0a0a0a;
      line-height: 20px;
      margin-bottom: 12px;
    }

    /* ── Combobox / Dropdown ──────────────────────── */
    .combobox {
      width: 100%;
      height: 48px;
      background: rgba(255,255,255,0);
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      box-shadow: 0px 1px 2px 0px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      cursor: pointer;
    }
    .combobox + .combobox { margin-top: 16px; }

    .combobox__left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .combobox__icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .combobox__name {
      font-size: 15.5px;
      font-weight: 400;
      color: #171717;
      line-height: 24px;
    }
    .combobox__name--token {
      font-size: 15.6px;
      color: #0a0a0a;
      line-height: 24px;
    }

    .combobox__chevron {
      width: 16px;
      height: 16px;
    }

    /* ── Amount Input ─────────────────────────────── */
    .amount-input {
      width: 100%;
      height: 50px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .amount-input__field {
      flex: 1;
      height: 48px;
      border: none;
      outline: none;
      padding: 0 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13.2px;
      font-weight: 400;
      color: #0a0a0a;
      background: transparent;
      border-radius: 8px 0 0 8px;
    }
    .amount-input__field::placeholder {
      color: #737373;
    }

    .amount-input__max {
      width: 16px;
      height: 48px;
      background: transparent;
    }

    /* ── Recipient Address Row ────────────────────── */
    .recipient-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
    }

    .recipient-row__text {
      font-size: 15.1px;
      font-weight: 400;
      color: #0a0a0a;
      line-height: 24px;
    }

    .recipient-row__edit {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    /* ── Connect Wallet Button (inside card) ──────── */
    .connect-btn-card {
      width: 100%;
      height: 36px;
      background: #171717;
      border-radius: 8px;
      box-shadow: 0px 1px 2px 0px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      cursor: pointer;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 13.2px;
      font-weight: 400;
      color: #fafafa;
      line-height: 20px;
    }

    /* ── Fluffey Mascot (MegaETH only) ───────────── */
    .fluffey-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 165px;
      height: 467px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .fluffey-iris-left {
      position: absolute;
      left: 29px;
      top: 378px;
      width: 25px;
      height: 25px;
    }

    .fluffey-iris-right {
      position: absolute;
      left: 97px;
      top: 378px;
      width: 25px;
      height: 25px;
    }

    .fluffey-body {
      position: absolute;
      top: 187px;
      width: 165px;
      height: 467px;
    }

    /* ── Chain Selection Cards ────────────────────── */
    .chain-selection {
      position: fixed;
      bottom: 60px;
      right: 7.8%;
      display: flex;
      align-items: flex-end;
      gap: 1px;
      z-index: 10000;
    }

    .chain-card {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .chain-card:active {
      transform: scale(0.9);
    }

    .chain-card--selected {
      width: 65px;
      height: 65px;
    }

    .chain-card--selected .chain-card__shadow {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 60px;
      height: 60px;
      background: #1f1f1e;
      transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .page--megaeth .chain-card--selected .chain-card__shadow {
      background: #FCDB32;
    }
    .chain-card--selected:active .chain-card__shadow {
      transform: translate(-2px, -2px);
    }

    .chain-card__face {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.15s ease;
    }
    .chain-card:active .chain-card__face {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    }
    .chain-card__face--white { background: #fffffe; }
    .chain-card__face--light { background: #f0f0ef; }
    .chain-card__face--citrea { background: #F0781B; }

    .chain-card__icon {
      width: 29px;
      height: 29px;
    }

    .chain-card__icon--avail {
      width: 60px;
      height: 60px;
    }

    .chain-card__icon--third {
      width: 42px;
      height: 35px;
    }

    /* ── Help Link (MegaETH only) ─────────────────── */
    .help-link {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 152px;
      height: 58px;
      border: 1px solid #19191a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 15px;
      cursor: pointer;
    }

    .help-link__text {
      font-family: 'Avenir', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #19191a;
      line-height: 20px;
    }

    /* ── Fade Transition ──────────────────────────── */
    .page {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .page.active {
      opacity: 1;
    }
    .fade-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .fade-overlay.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     MegaETH Screen
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="page page--megaeth active" id="page-megaeth">

  <!-- Nav -->
  <div class="nav">
    <div class="nav__left">
      <img src="assets/fb-megaeth-logo.svg" alt="MegaETH" class="nav__chain-logo nav__chain-logo--megaeth" />
      <span class="nav__bridge-text">Fast Bridge by</span>
      <img src="assets/fb-avail-logo.svg" alt="Avail" class="nav__avail-logo" />
    </div>
    <button class="nav__connect-btn">Connect Wallet <span class="connect-arrow"><img src="assets/fb-megaeth-connect-arrow.svg" alt="" /></span></button>
  </div>

  <!-- Bridge Form Card -->
  <div class="bridge-card">
    <span class="bridge-card__label">To</span>

    <!-- Chain Selector -->
    <div class="combobox">
      <div class="combobox__left">
        <img src="assets/fb-megaeth-icon.png" alt="MegaETH" class="combobox__icon" />
        <span class="combobox__name">MegaETH</span>
      </div>
      <img src="assets/fb-chevron-down.svg" alt="" class="combobox__chevron" />
    </div>

    <!-- Token Selector -->
    <div class="combobox">
      <div class="combobox__left">
        <img src="assets/fb-usdm-icon.png" alt="USDM" class="combobox__icon" />
        <span class="combobox__name combobox__name--token">USDM</span>
      </div>
      <img src="assets/fb-chevron-down.svg" alt="" class="combobox__chevron" />
    </div>

    <!-- Amount Input -->
    <div class="amount-input">
      <input type="text" class="amount-input__field" placeholder="Enter Amount" />
      <div class="amount-input__max"></div>
    </div>

    <!-- Recipient Address -->
    <div class="recipient-row">
      <span class="recipient-row__text">Recipient Address</span>
      <img src="assets/fb-edit-button.svg" alt="Edit" class="recipient-row__edit" />
    </div>

    <!-- Connect Wallet -->
    <button class="connect-btn-card">Connect Wallet</button>

<div id="fadeOverlay" class="fade-overlay"></div>

<script>
  // ── Fade Transition ────────────────────────────
  var isTransitioning = false;
  var fadeOverlay = document.getElementById('fadeOverlay');

  function switchPage(chain) {
    var currentActive = document.querySelector('.page.active');
    var targetId = 'page-' + chain;

    // Skip if already on this page or mid-transition
    if (currentActive && currentActive.id === targetId) return;
    if (isTransitioning) return;
    isTransitioning = true;

    // Fade out: show white overlay
    fadeOverlay.classList.add('visible');

    // After fade out completes, swap pages and fade back in
    setTimeout(function() {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(targetId).classList.add('active');

      // Small delay then fade overlay back out
      setTimeout(function() {
        fadeOverlay.classList.remove('visible');
        // Allow new transitions after fade-in completes
        setTimeout(function() {
          isTransitioning = false;
        }, 300);
      }, 50);
    }, 300);
  }
</script>
